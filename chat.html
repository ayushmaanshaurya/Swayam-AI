<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swayam AI</title>
  <link rel="stylesheet" href="chat.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="splashScreen" class="splash">
  <div class="logo-container">
    <img src="assets/logo.png" class="app-logo">
    <h1>swayam AI</h1>
    <p>Smart Learning Assistant</p>
  </div>
</div>

<div id="mainApp" class="app-container" style="display:none;">

  <div class="chat-container">

    <div class="chat-header">
      <div class="logo">AI Tutor</div>
      <div class="header-actions">

  <!-- Coding Agent -->
  <button
    id="codingModeBtn"
    type="button"
    title="Open Coding Agent"
    aria-pressed="false"
  >
    💻 Coding
  </button>

  <!-- Swayam Mirror -->
  <button
    id="mirrorModeBtn"
    type="button"
    title="Analyze your understanding and find misconceptions"
    aria-pressed="false"
  >
    🪞 Mirror
  </button>

  <!-- Language -->
  <button
    id="langToggle"
    type="button"
    title="Change language"
  >
    EN
  </button>

  <!-- Voice -->
  <button
    id="micBtn"
    type="button"
    title="Voice input"
  >
    🎤
  </button>

  <!-- National Anthem -->
  <button
    id="anthemBtn"
    type="button"
    title="Play national anthem"
  >
    🇮🇳
  </button>

  <!-- Profile -->
  <img
    id="navProfilePic"
    class="profile-pic"
    alt="Profile"
  >

  <!-- Logout -->
  <button
    id="logoutBtn"
    type="button"
  >
    Logout
  </button>

</div>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form" class="input-area">

      <div id="mirrorTopicArea" class="mirror-topic-area" hidden>
        <label for="mirrorTopicInput">Topic (optional)</label>
        <input
          id="mirrorTopicInput"
          type="text"
          placeholder="e.g. CPU Pipelining, DBMS, Operating Systems..."
          autocomplete="off"
        >
      </div>

      <div class="chat-input-row">
      <input
        id="user-input"
        type="text"
        placeholder="Ask anything..."
        autocomplete="off"
      >
      <button type="submit">Send</button>
      </div>
    </form>

  </div>

    <div id="learningDashboard" class="learning-dashboard" hidden>
      <div class="learning-dashboard-backdrop" data-close-dashboard></div>
      <section class="learning-dashboard-panel" role="dialog" aria-modal="true" aria-labelledby="learningDashboardTitle">
        <div class="learning-dashboard-header">
          <div>
            <div class="learning-dashboard-eyebrow">🧠 Learning Twin</div>
            <h2 id="learningDashboardTitle">Your progress</h2>
            <p id="learningDashboardUser">Your learning snapshot</p>
          </div>
          <button id="closeLearningDashboard" class="learning-dashboard-close" type="button" aria-label="Close dashboard">×</button>
        </div>

        <div class="learning-dashboard-stats">
          <div class="learning-stat"><span>Topics</span><strong id="dashboardTopics">0</strong></div>
          <div class="learning-stat"><span>Avg mastery</span><strong id="dashboardMastery">—</strong></div>
          <div class="learning-stat"><span>Analyses</span><strong id="dashboardAnalyses">0</strong></div>
          <div class="learning-stat"><span>Active days</span><strong id="dashboardStreak">0</strong></div>
        </div>

        <div class="learning-dashboard-section">
          <div class="learning-section-title">
            <h3>Mastery by topic</h3>
            <span>Mirror</span>
          </div>
          <div id="dashboardTopicsList" class="learning-topics-list"></div>
        </div>

        <div class="learning-dashboard-section">
          <div class="learning-section-title">
            <h3>Recent activity</h3>
          </div>
          <div id="dashboardRecent" class="learning-recent-list"></div>
        </div>
      </section>
    </div>


</div>

<audio id="anthemAudio" src="audio/vishuaashi-bhojpuri-166899.mp3"></audio>
<script src="chat.js?v=7"></script>

</body>
</html>
