<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swayam AI</title>
  <link rel="stylesheet" href="chat.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="splashScreen" class="splash">
  <div class="logo-container">
    <img src="assets/logo.png" class="app-logo">
    <h1>swayam AI</h1>
    <p>Smart Learning Assistant</p>
  </div>
</div>

<div id="mainApp" class="app-container" style="display:none;">

  <div class="chat-container">

    <div class="chat-header">
      <div class="logo">AI Tutor</div>
      <div class="header-actions">

  <!-- Coding Agent -->
  <button
    id="codingModeBtn"
    type="button"
    title="Open Coding Agent"
    aria-pressed="false"
  >
    💻 Coding
  </button>

  <!-- Swayam Mirror -->
  <button
    id="mirrorModeBtn"
    type="button"
    title="Analyze your understanding and find misconceptions"
    aria-pressed="false"
  >
    🪞 Mirror
  </button>

  <!-- Language -->
  <button
    id="langToggle"
    type="button"
    title="Change language"
  >
    EN
  </button>

  <!-- Voice -->
  <button
    id="micBtn"
    type="button"
    title="Voice input"
  >
    🎤
  </button>

  <!-- National Anthem -->
  <button
    id="anthemBtn"
    type="button"
    title="Play national anthem"
  >
    🇮🇳
  </button>

  <!-- Profile -->
  <img
    id="navProfilePic"
    class="profile-pic"
    alt="Profile"
  >

  <!-- Logout -->
  <button
    id="logoutBtn"
    type="button"
  >
    Logout
  </button>

</div>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form" class="input-area">

      <div id="mirrorTopicArea" class="mirror-topic-area" hidden>
        <label for="mirrorTopicInput">Topic (optional)</label>
        <input
          id="mirrorTopicInput"
          type="text"
          placeholder="e.g. CPU Pipelining, DBMS, Operating Systems..."
          autocomplete="off"
        >
      </div>

      <div class="chat-input-row">
      <input
        id="user-input"
        type="text"
        placeholder="Ask anything..."
        autocomplete="off"
      >
      <button type="submit">Send</button>
      </div>
    </form>

  </div>

</div>

<audio id="anthemAudio" src="audio/vishuaashi-bhojpuri-166899.mp3"></audio>
<script src="chat.js?v=5"></script>

</body>
</html>
