<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Swayam AI</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splashScreen" class="splash">
  <div class="logo-container">
    <img src="assets/logo.png" class="app-logo">
    <h1>Swayam AI</h1>
    <p>Smart Learning Assistant</p>
  </div>
</div>

<!-- Login Content -->
<div id="loginContent" style="display:none;">

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
      </div>

      <form id="loginForm" class="form active">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="form">
        <input id="regUser" placeholder="Username" autocomplete="username" required>
        <input id="regEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="regPass" type="password" placeholder="Password" autocomplete="new-password" required>
        <button type="submit">Register</button>
      </form>

    </div>
  </div>

</div>

<script src="auth.js"></script>
<script src="splash.js"></script>

</body>
</html>
